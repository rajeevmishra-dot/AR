<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truck 3D viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg-top: #e9edf0;
    --bg-bottom: #c9d1d6;
    --ink: #1c2429;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --bar: rgba(255,255,255,.86);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #2a3238;
      --bg-bottom: #151a1e;
      --ink: #eef2f4;
      --accent: #6cb4e4;
      --accent-ink: #0f1a22;
      --bar: rgba(30,37,42,.88);
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
  }
  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
  }
  .controls {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex;
    gap: 10px;
    padding: 8px;
    border-radius: 999px;
    background: var(--bar);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    pointer-events: auto;
  }
  button {
    pointer-events: auto;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    min-height: 44px;
    cursor: pointer;
    color: var(--ink);
    background: transparent;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[hidden] { display: none; }
  .ar-note {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px; right: 72px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--bar);
    font-size: 14px;
    display: none;
  }
  model-viewer[ar-status="session-started"] .ar-note { display: block; }
  .hint {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    opacity: .7;
    pointer-events: none;
  }
</style>
</head>
<body>

<model-viewer id="mv"
  src="model.glb"
  alt="3D model of a truck"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1"
  environment-image="neutral"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  interaction-prompt="auto">

  <!-- Empty slot hides model-viewer's default AR button; we use our own below -->
  <button slot="ar-button" hidden></button>

  <div class="ar-note">Move your phone slowly to find the floor, then tap to place the truck.</div>

  <div class="controls">
  <button id="play" type="button" hidden>Play animation</button>
  <button id="ar" type="button" class="primary" hidden>View in your space</button>
</div>
</model-viewer>

<p class="hint" id="status">Loading model…</p>



<script>
  const mv = document.getElementById('mv');
  const playBtn = document.getElementById('play');
  const arBtn = document.getElementById('ar');
  const status = document.getElementById('status');

  // Add ?webxr to the address to allow only in-browser AR (no Scene Viewer fallback).
  // If "View in your space" then disappears, this phone can't do in-browser AR.
  if (new URLSearchParams(location.search).has('webxr')) mv.setAttribute('ar-modes', 'webxr');

  function say(text) { status.textContent = text; status.style.opacity = 1; }

  // If the viewer library never registered, the CDN script was blocked or offline
  setTimeout(() => {
    if (!customElements.get('model-viewer')) {
      say('Viewer library failed to load. Check your internet connection.');
    }
  }, 5000);

  mv.addEventListener('progress', (e) => {
    const p = e.detail.totalProgress;
    if (p < 1) say('Loading model… ' + Math.round(p * 100) + '%');
  });

  mv.addEventListener('load', () => {
    say('Drag to rotate. Pinch to zoom.');
    status.style.opacity = .7;
    if (mv.availableAnimations && mv.availableAnimations.length) {
      mv.animationName = mv.availableAnimations[0];
      mv.pause();
      mv.currentTime = 0;
      playBtn.hidden = false;
    }
    if (mv.canActivateAR) arBtn.hidden = false;
  });

  mv.addEventListener('error', (e) => {
    const d = e.detail && (e.detail.sourceError || e.detail.type);
    say('Could not load model.glb' + (d ? ' (' + (d.message || d) + ')' : '') +
        '. Make sure it sits next to index.html.');
  });

  playBtn.addEventListener('click', () => {
    if (mv.paused) {
      mv.play({ repetitions: Infinity });
      playBtn.textContent = 'Pause animation';
    } else {
      mv.pause();
      playBtn.textContent = 'Play animation';
    }
  });

  arBtn.addEventListener('click', () => mv.activateAR());

  // In an in-browser (WebXR) AR session, keep the play button but hide "View in your space"
  mv.addEventListener('ar-status', (e) => {
    arBtn.style.display = e.detail.status === 'session-started' ? 'none' : '';
  });
</script>
</body>
</html>
