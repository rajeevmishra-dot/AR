<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truck 3D viewer</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root {
    --bg-top: #e9edf0;
    --bg-bottom: #c9d1d6;
    --ink: #1c2429;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --bar: rgba(255,255,255,.9);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-top: #2a3238;
      --bg-bottom: #151a1e;
      --ink: #eef2f4;
      --accent: #6cb4e4;
      --accent-ink: #0f1a22;
      --bar: rgba(30,37,42,.92);
    }
  }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: linear-gradient(var(--bg-top), var(--bg-bottom));
  }
  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
  }

  /* model-viewer's overlay container ignores taps, so everything tappable opts back in */
  .controls, .panel, button { pointer-events: auto; }

  .controls {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    display: flex;
    gap: 6px;
    padding: 6px;
    border-radius: 999px;
    background: var(--bar);
    box-shadow: 0 6px 24px rgba(0,0,0,.18);
    max-width: calc(100% - 24px);
  }
  button {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    border: 0;
    border-radius: 999px;
    padding: 10px 14px;
    min-height: 44px;
    cursor: pointer;
    color: var(--ink);
    background: transparent;
    white-space: nowrap;
  }
  button.primary,
  button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  button[hidden] { display: none; }

  /* Pop-up info panel */
  .panel {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 86px);
    width: min(420px, calc(100% - 32px));
    box-sizing: border-box;
    padding: 16px 18px 18px;
    border-radius: 16px;
    background: var(--bar);
    box-shadow: 0 8px 30px rgba(0,0,0,.22);
  }
  .panel[hidden] { display: none; }
  .panel h2 { margin: 0 36px 8px 0; font-size: 18px; }
  .panel p { margin: 0; font-size: 15px; line-height: 1.5; }
  .panel .close {
    position: absolute; top: 6px; right: 6px;
    width: 44px; padding: 0; font-size: 22px; line-height: 1;
  }

  .ar-note {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 16px; right: 72px;
    padding: 10px 14px;
    border-radius: 12px;
    background: var(--bar);
    font-size: 14px;
    display: none;
  }
  model-viewer[ar-status="session-started"] .ar-note { display: block; }

  .hint {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 16px);
    left: 0; right: 0;
    text-align: center;
    font-size: 14px;
    opacity: .7;
    pointer-events: none;
  }
</style>
</head>
<body>

<model-viewer id="mv"
  src="model.glb"
  alt="3D model of a truck"
  camera-controls
  touch-action="pan-y"
  shadow-intensity="1"
  shadow-softness="0.8"
  exposure="1"
  environment-image="neutral"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-scale="auto"
  interaction-prompt="auto">

  <!-- Empty slot hides model-viewer's default AR button; we use our own below -->
  <button slot="ar-button" hidden></button>

  <div class="ar-note">Move your phone slowly to find the floor, then tap to place the truck.</div>

  <!-- Pop-up panel. Edit the title and text below. -->
  <section class="panel" id="panel" hidden aria-label="About this model">
    <h2>About this model</h2>
    <p>Replace this text with your own description, specs or credits. This panel also shows while you are in AR.</p>
    <button class="close" id="panel-close" type="button" aria-label="Close">&times;</button>
  </section>

  <div class="controls">
    <button id="play" type="button" hidden>Play</button>
    <button id="info" type="button" aria-pressed="false">Info</button>
    <button id="music" type="button" aria-pressed="false">Music</button>
    <button id="ar" type="button" class="primary" hidden>View in AR</button>
  </div>
</model-viewer>

<p class="hint" id="status">Loading model…</p>

<script>
  const mv = document.getElementById('mv');
  const playBtn = document.getElementById('play');
  const infoBtn = document.getElementById('info');
  const musicBtn = document.getElementById('music');
  const arBtn = document.getElementById('ar');
  const panel = document.getElementById('panel');
  const status = document.getElementById('status');

  // Add ?webxr to the address to allow only in-browser AR (no Scene Viewer fallback).
  if (new URLSearchParams(location.search).has('webxr')) mv.setAttribute('ar-modes', 'webxr');

  function say(text) { status.textContent = text; status.style.opacity = 1; }

  // If the viewer library never registered, the CDN script was blocked or offline
  setTimeout(() => {
    if (!customElements.get('model-viewer')) {
      say('Viewer library failed to load. Check your internet connection.');
    }
  }, 5000);

  mv.addEventListener('progress', (e) => {
    const p = e.detail.totalProgress;
    if (p < 1) say('Loading model… ' + Math.round(p * 100) + '%');
  });

  mv.addEventListener('load', () => {
    say('Drag to rotate. Pinch to zoom.');
    status.style.opacity = .7;
    if (mv.availableAnimations && mv.availableAnimations.length) {
      mv.animationName = mv.availableAnimations[0];
      mv.pause();
      mv.currentTime = 0;
      playBtn.hidden = false;
    }
    if (mv.canActivateAR) arBtn.hidden = false;
  });

  mv.addEventListener('error', (e) => {
    const d = e.detail && (e.detail.sourceError || e.detail.type);
    say('Could not load model.glb' + (d ? ' (' + (d.message || d) + ')' : '') +
        '. Make sure it sits next to index.html.');
  });

  /* ---------- Animation ---------- */
  playBtn.addEventListener('click', () => {
    if (mv.paused) {
      mv.play({ repetitions: Infinity });
      playBtn.textContent = 'Pause';
    } else {
      mv.pause();
      playBtn.textContent = 'Play';
    }
  });

  /* ---------- Info pop-up ---------- */
  function setPanel(open) {
    panel.hidden = !open;
    infoBtn.setAttribute('aria-pressed', String(open));
  }
  infoBtn.addEventListener('click', () => setPanel(panel.hidden));
  document.getElementById('panel-close').addEventListener('click', () => setPanel(false));

  /* ---------- Music ---------- */
  const music = new Audio('music.mp3');
  music.loop = true;
  music.volume = 0.6;
  let startedByAR = false;

  function setMusic(on) {
    if (on) {
      music.play().then(() => musicBtn.setAttribute('aria-pressed', 'true'))
                  .catch(() => musicBtn.setAttribute('aria-pressed', 'false'));
    } else {
      music.pause();
      musicBtn.setAttribute('aria-pressed', 'false');
    }
  }
  musicBtn.addEventListener('click', () => {
    startedByAR = false;
    setMusic(music.paused);
  });

  /* ---------- AR ---------- */
  arBtn.addEventListener('click', () => mv.activateAR());

  // In-browser (WebXR) AR: hide the launch button, start music, and stop it again on exit
  mv.addEventListener('ar-status', (e) => {
    const s = e.detail.status;
    arBtn.style.display = s === 'session-started' || s === 'object-placed' ? 'none' : '';
    if (s === 'session-started' && music.paused) {
      startedByAR = true;
      setMusic(true);
    }
    if (s === 'not-presenting' && startedByAR) {
      startedByAR = false;
      setMusic(false);
    }
  });
</script>
</body>
</html>
